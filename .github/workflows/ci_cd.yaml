name: AI Agent CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    # 1. Grab your code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Install Python on the GitHub server
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Install your dependencies plus testing tools
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8 httpx

    # 4. Run the Linter (Checks for messy code or syntax errors)
    - name: Run Flake8 Linter
      run: |
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

# 5. Run the Unit Tests
    - name: Run Pytest
      env:
        GROQ_API_KEY: "dummy_groq_key_for_testing"
        TAVILY_API_KEY: "dummy_tavily_key_for_testing"
      run: |
        pytest tests/